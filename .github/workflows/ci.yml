name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "release/**"
      - "upload-*"
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Build Cloudflare static output
        run: npm run build:cloudflare
