<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="34" fill="#f8f2e9"/>
  <rect x="24" y="24" width="1152" height="712" rx="28" fill="#fffdf8" stroke="#dfd1c0" stroke-width="2"/>

  <text x="72" y="96" fill="#94633f" font-family="Georgia, serif" font-size="52" font-weight="700">Jam Tracks Hub</text>
