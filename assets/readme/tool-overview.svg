  <text x="72" y="176" fill="#504842" font-family="Arial, sans-serif" font-size="22" font-weight="600">A practical workspace for practice tracks, harmony study, guitar shapes,</text>
  <text x="72" y="206" fill="#504842" font-family="Arial, sans-serif" font-size="22" font-weight="600">and custom progression exports.</text>

  <g transform="translate(72 248)">
