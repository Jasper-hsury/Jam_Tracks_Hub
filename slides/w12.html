<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W12 Smooth Fusion Backing Track in E | Slides</title>
    <link rel="icon" href="../icon.png" type="image/png">
    <style>
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #121212;
            color: #f3eee7;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1;
            padding: 14px 18px;
            background: rgba(18, 18, 18, 0.86);
            border-bottom: 1px solid rgba(196, 164, 132, 0.24);
            backdrop-filter: blur(12px);
        }

        h1 {
            margin: 0;
            font-size: clamp(18px, 3vw, 24px);
            line-height: 1.25;
        }

        main {
            display: grid;
            gap: 18px;
            width: min(1180px, calc(100% - 28px));
            margin: 18px auto 36px;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
            background: #080808;
            border-radius: 8px;
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.34);
        }
    </style>
</head>
<body>
    <header>
        <h1>W12 Smooth Fusion Backing Track in E</h1>
    </header>
    <main aria-label="W12 slide images">
        <img src="W12/W12.001.jpeg" alt="W12 slide 1">
        <img src="W12/W12.002.jpeg" alt="W12 slide 2">
    </main>
</body>
</html>
