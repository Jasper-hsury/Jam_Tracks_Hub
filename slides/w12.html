<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W12 Smooth Fusion Backing Track in E | Slides</title>
    <link rel="icon" href="../assets/images/icon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Serif+TC:wght@600&family=Work+Sans:wght@400;600&display=swap">
    <style>
        /* v4 Jazz Stage: the slides sit on the night stage. */
        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #081627;
            color: #f1e9d8;
            font-family: "Work Sans", "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1;
            padding: 14px max(18px, calc((100% - 1180px) / 2));
            background: rgba(8, 22, 39, 0.88);
            border-bottom: 4px solid #f2b705;
            backdrop-filter: blur(12px);
        }

        .kicker {
            margin: 0 0 4px;
            color: #f2b705;
            font-size: 13px;
            font-weight: 600;
        }

        h1 {
            margin: 0;
            font-family: "DM Serif Display", "Noto Serif TC", Georgia, serif;
            font-size: clamp(20px, 3vw, 28px);
            font-weight: 400;
            line-height: 1.2;
        }

        main {
            display: grid;
            gap: 18px;
            width: min(1180px, calc(100% - 28px));
            margin: 22px auto 40px;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
            background: #0f223a;
            border-radius: 18px;
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.45);
        }
    </style>
</head>
<body>
    <header>
        <p class="kicker">Jam Tracks Hub · Slides</p>
        <h1>W12 Smooth Fusion Backing Track in E</h1>
    </header>
    <main aria-label="W12 slide images">
        <img src="W12/W12.001.jpeg" alt="W12 slide 1">
        <img src="W12/W12.002.jpeg" alt="W12 slide 2">
    </main>
</body>
</html>
